openapi: 3.0.3

info:
  title: API de Tienda Virtual - TP2
  description: >
    Documentación oficial de la API del Proyecto Final TP2.  
    Backend construido con Node.js + Express + Supabase.  
    Autenticación mediante JWT + Roles (admin/usuario).
  version: 1.0.0

servers:
  - url: https://proyectofinal-pnt2-tp2-eight.vercel.app/api/v1
    description: Producción Vercel
  - url: http://localhost:3000/api/v1
    description: Servidor local de desarrollo

tags:
  - name: Autenticación
  - name: Usuarios
  - name: Productos
  - name: Estadísticas

paths:

  # ==========================================================
  # AUTENTICACIÓN
  # ==========================================================

  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUser"
      responses:
        "201":
          description: Usuario registrado con éxito
        "400":
          description: Datos inválidos

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUser"
      responses:
        "200":
          description: Token generado
        "401":
          description: Credenciales incorrectas

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Obtener usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
        "401":
          description: Token inválido o expirado

  # ==========================================================
  # USUARIOS
  # ==========================================================

  /users:
    get:
      tags: [Usuarios]
      summary: Obtener todos los usuarios (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
        "403":
          description: Requiere rol admin

    post:
      tags: [Usuarios]
      summary: Crear usuario (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserAdmin"
      responses:
        "201":
          description: Usuario creado
        "403":
          description: Solo administradores

  /users/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por ID (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario encontrado
        "404":
          description: No existe
        "403":
          description: Solo admin

    put:
      tags: [Usuarios]
      summary: Actualizar usuario (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: Usuario actualizado
        "404":
          description: No existe

    delete:
      tags: [Usuarios]
      summary: Eliminar usuario (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado
        "404":
          description: No existe

  # ==========================================================
  # PRODUCTOS
  # ==========================================================

  /products:
    get:
      tags: [Productos]
      summary: Obtener todos los productos
      responses:
        "200":
          description: Lista de productos

    post:
      tags: [Productos]
      summary: Crear producto (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "201":
          description: Producto creado
        "403":
          description: Solo admin

  /products/{id}:
    get:
      tags: [Productos]
      summary: Obtener producto por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Producto encontrado
        "404":
          description: No existe

    put:
      tags: [Productos]
      summary: Actualizar un producto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduct"
      responses:
        "200":
          description: Producto actualizado
        "404":
          description: No existe

    delete:
      tags: [Productos]
      summary: Eliminar un producto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Producto eliminado
        "404":
          description: No existe

  # ==========================================================
  # ESTADÍSTICAS
  # ==========================================================

  /products/stats:
    get:
      tags: [Estadísticas]
      summary: Obtener estadísticas generales
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estadísticas generadas

  /products/analytics/prices:
    get:
      tags: [Estadísticas]
      summary: Distribución de precios de productos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Análisis generado

# ==========================================================
# COMPONENTS
# ==========================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterUser:
      type: object
      required: [nombre, apellido, email, password]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
        password: { type: string }

    LoginUser:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    CreateUserAdmin:
      type: object
      required: [nombre, apellido, email, password, role]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string }
        password: { type: string }
        role:
          type: string
          enum: [admin, user]

    UpdateUser:
      type: object
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [admin, user]

    CreateProduct:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string }
        precio: { type: number }
        descripcion: { type: string }
        stock: { type: number }
        img_url: { type: string }

    UpdateProduct:
      type: object
      properties:
        nombre: { type: string }
        precio: { type: number }
        descripcion: { type: string }
        stock: { type: number }
        img_url: { type: string }
